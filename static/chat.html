<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Only Docs Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080a0f;
      --border: rgba(255,255,255,0.07);
      --accent: #00d4ff;
      --accent2: #ffe600;
      --text: #c8d0e0;
      --text-dim: rgba(200,208,224,0.38);
      --bubble-bot: rgba(0,212,255,0.07);
      --bubble-user: rgba(255,230,0,0.06);
      --gutter: 24px;
      --max: 820px;
      --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); font-family: 'Syne', sans-serif; color: var(--text); overflow: hidden; }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: fixed;
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,212,255,0.06) 0%, transparent 70%);
      top: -200px; right: -150px; pointer-events: none; z-index: 0;
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--gutter);
      background: rgba(8,10,15,0.85); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: baseline; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
    .brand .only { color: var(--accent2); }
    .brand .docs { color: var(--accent); }
    .brand .bot  { color: rgba(200,208,224,0.45); font-weight: 400; font-size: 12px; margin-left: 6px; letter-spacing: 2.5px; text-transform: uppercase; }

    .upload-zone { display: flex; align-items: center; gap: 10px; }
    .pdf-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .pdf-tag {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2);
      color: var(--accent); padding: 3px 10px 3px 8px; border-radius: 20px;
      font-size: 11px; font-family: 'Space Mono', monospace;
      animation: tagIn 0.3s ease;
    }
    @keyframes tagIn { from{opacity:0;transform:scale(0.8);} to{opacity:1;transform:scale(1);} }
    .pdf-tag .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 6px var(--accent);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .upload-btn {
      display: flex; align-items: center; gap: 7px;
      background: transparent; border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); padding: 7px 14px; border-radius: 10px;
      cursor: pointer; font-size: 12px; font-family: 'Syne', sans-serif;
      font-weight: 600; letter-spacing: 0.5px; transition: all 0.2s; white-space: nowrap;
    }
    .upload-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px rgba(0,212,255,0.15); }
    .upload-btn svg { width: 13px; height: 13px; }
    .upload-status { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--text-dim); min-width: 60px; text-align: right; }
    #fileInput { display: none; }

    .stage { position: fixed; top: 58px; bottom: 82px; left: 0; right: 0; overflow: hidden; z-index: 1; }
    .chat {
      height: 100%; overflow-y: auto; padding: 28px var(--gutter) 16px;
      display: flex; flex-direction: column; gap: 14px;
      max-width: var(--max); margin: 0 auto;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .chat::-webkit-scrollbar { width: 4px; }
    .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

    .welcome {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; text-align: center; opacity: 0.5; padding: 40px 20px;
      transition: opacity 0.3s;
    }
    .welcome-icon { font-size: 42px; }
    .welcome h2 { font-size: 17px; font-weight: 700; }
    .welcome p { font-size: 13px; color: var(--text-dim); font-family: 'Space Mono', monospace; max-width: 280px; line-height: 1.6; }

    .msg-row { display: flex; width: 100%; animation: msgIn 0.25s ease; }
    @keyframes msgIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    .msg-row.bot  { justify-content: flex-start; }
    .msg-row.user { justify-content: flex-end; }

    .bubble {
      max-width: 72%; padding: 13px 17px; border-radius: var(--radius);
      font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .bubble.bot  { background: var(--bubble-bot); border: 1px solid rgba(0,212,255,0.12); color: #a8d8f0; border-bottom-left-radius: 4px; }
    .bubble.user { background: var(--bubble-user); border: 1px solid rgba(255,230,0,0.12); color: #f0e080; border-bottom-right-radius: 4px; font-family: 'Space Mono', monospace; font-size: 13px; }

    /* Typewriter blinking cursor */
    .bubble.bot.typing-active::after {
      content: '▋';
      display: inline-block;
      color: var(--accent);
      animation: cursorBlink 0.7s step-end infinite;
      margin-left: 2px;
      font-size: 13px;
      vertical-align: baseline;
    }
    @keyframes cursorBlink { 0%,100%{opacity:1;} 50%{opacity:0;} }

    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 4px 2px; }
    .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dot 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%,80%,100%{transform:scale(0.7);opacity:0.3;} 40%{transform:scale(1);opacity:1;} }

    .input-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding: 10px var(--gutter) 14px;
      background: rgba(8,10,15,0.9); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
    }
    .input-inner {
      max-width: var(--max); margin: 0 auto;
      display: flex; gap: 10px; align-items: flex-end;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 8px 8px 8px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-inner:focus-within { border-color: rgba(0,212,255,0.3); box-shadow: 0 0 0 3px rgba(0,212,255,0.06); }
    textarea.input-field {
      flex: 1; min-height: 28px; max-height: 160px; resize: none; overflow: auto;
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; line-height: 1.5; font-family: 'Syne', sans-serif;
      scrollbar-width: none; padding: 2px 0;
    }
    textarea.input-field::-webkit-scrollbar { display: none; }
    textarea.input-field::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 38px; height: 38px; flex-shrink: 0;
      display: grid; place-items: center;
      border: none; background: var(--accent); border-radius: 10px;
      cursor: pointer; transition: all 0.2s;
    }
    .send-btn:hover:not([disabled]) { background: #1ae0ff; box-shadow: 0 0 16px rgba(0,212,255,0.4); transform: scale(1.05); }
    .send-btn[disabled] { opacity: 0.3; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; fill: #080a0f; }

    .progress-bar { position: fixed; top: 58px; left: 0; right: 0; height: 2px; z-index: 200; overflow: hidden; }
    .progress-bar.active::after {
      content: ''; display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: prog 1s ease-in-out infinite;
    }
    @keyframes prog { from{transform:translateX(-100%);} to{transform:translateX(350%);} }

    @media (max-width: 520px) {
      .brand .bot { display: none; }
      .bubble { max-width: 88%; font-size: 14px; }
      .upload-status { display: none; }
    }
  </style>
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <header>
    <div class="brand">
      <span class="only">Only</span><span class="docs">Docs</span>
      <span class="bot">bot</span>
    </div>
    <div class="upload-zone">
      <div class="pdf-tags" id="pdfList"></div>
      <span class="upload-status" id="uploadStatus"></span>
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 12h12v1.5H2zM8 2L3.5 7h3V11h3V7h3z"/></svg>
        Upload PDF
      </button>
      <input type="file" id="fileInput" accept=".pdf" multiple />
    </div>
  </header>

  <div class="stage">
    <div id="chat" class="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">📄</div>
        <h2>Upload a document to get started</h2>
        <p>Ask anything about your PDF — summaries, details, characters, concepts.</p>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-inner">
      <textarea id="msgInput" class="input-field" placeholder="Ask me anything about your PDF..." spellcheck="false" rows="1"></textarea>
      <button id="sendBtn" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
  (function(){
    const API_URL = window.location.origin;
    let sessionId = null;
    let uploadedPdfs = [];
    let welcomeRemoved = false;

    const chat         = document.getElementById('chat');
    const textarea     = document.getElementById('msgInput');
    const sendBtn      = document.getElementById('sendBtn');
    const fileInput    = document.getElementById('fileInput');
    const pdfList      = document.getElementById('pdfList');
    const uploadStatus = document.getElementById('uploadStatus');
    const progressBar  = document.getElementById('progressBar');
    const welcome      = document.getElementById('welcome');

    async function initSession() {
      try {
        const res  = await fetch(API_URL + '/session', { method: 'POST' });
        const data = await res.json();
        sessionId  = data.session_id;
      } catch(e) { console.error('[SESSION ERROR]', e); }
    }

    window.addEventListener('beforeunload', () => {
      if (sessionId) navigator.sendBeacon(API_URL + '/cleanup/' + sessionId);
    });

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!sessionId) return;
      if (uploadedPdfs.length + files.length > 2) { showStatus('⚠ Max 2 PDFs', 3000); return; }

      for (const file of files) {
        if (uploadedPdfs.length >= 2) break;
        showStatus('Uploading…', 0);
        progressBar.classList.add('active');
        const formData = new FormData();
        formData.append('file', file);
        try {
          const res  = await fetch(`${API_URL}/upload?session_id=${sessionId}`, { method: 'POST', body: formData });
          const data = await res.json();
          if (res.ok) {
            uploadedPdfs.push(file.name);
            addPdfTag(file.name);
            showStatus('✓ Ready', 2500);
            removeWelcome();
            typewriterMessage(`"${file.name}" is ready — ask me anything about it.`);
          } else {
            showStatus(`✗ ${data.detail}`, 3000);
          }
        } catch(err) {
          showStatus('✗ Upload failed', 3000);
        } finally {
          progressBar.classList.remove('active');
        }
      }
      fileInput.value = '';
    });

    function addPdfTag(name) {
      const tag = document.createElement('div');
      tag.className = 'pdf-tag';
      const dot = document.createElement('span');
      dot.className = 'dot';
      tag.appendChild(dot);
      tag.appendChild(document.createTextNode(name));
      pdfList.appendChild(tag);
    }

    function showStatus(msg, duration) {
      uploadStatus.textContent = msg;
      if (duration > 0) setTimeout(() => uploadStatus.textContent = '', duration);
    }

    function removeWelcome() {
      if (!welcomeRemoved && welcome) {
        welcome.style.opacity = '0';
        setTimeout(() => welcome.remove(), 300);
        welcomeRemoved = true;
      }
    }

    function addMessage(text, who) {
      const row    = document.createElement('div');
      row.className = 'msg-row ' + who;
      const bubble  = document.createElement('div');
      bubble.className = 'bubble ' + who;
      if (text === '__typing__') {
        bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      } else {
        bubble.textContent = text;
      }
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
      return bubble;
    }

    // Typewriter: streams text character by character with natural rhythm
    function typewriterMessage(text, bubble) {
      let targetBubble = bubble;

      if (!targetBubble) {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        targetBubble = document.createElement('div');
        targetBubble.className = 'bubble bot';
        row.appendChild(targetBubble);
        chat.appendChild(row);
      }

      targetBubble.textContent = '';
      targetBubble.classList.add('typing-active');

      let i = 0;
      const chars = text.split('');

      function getDelay(ch) {
        if (ch === '.' || ch === '!' || ch === '?') return 55;
        if (ch === ',') return 28;
        if (ch === '\n') return 40;
        return Math.random() * 10 + 12; // 12–22ms
      }

      function tick() {
        if (i >= chars.length) {
          targetBubble.classList.remove('typing-active');
          chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
          return;
        }
        targetBubble.textContent += chars[i];
        chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
        setTimeout(tick, getDelay(chars[i]));
        i++;
      }

      tick();
      return targetBubble;
    }

    function setSendDisabled(v) { sendBtn.disabled = v; textarea.disabled = v; }

    async function sendMessage() {
      const query = textarea.value.trim();
      if (!query) return;
      if (!sessionId) { typewriterMessage('Session not ready — please refresh.'); return; }

      removeWelcome();
      addMessage(query, 'user');
      textarea.value = '';
      autoResize();

      // Show thinking dots while waiting for server
      const thinkingBubble = addMessage('__typing__', 'bot');
      setSendDisabled(true);

      try {
        const res  = await fetch(API_URL + '/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, session_id: sessionId })
        });
        const data = await res.json();
        const responseText = data.response || 'No response.';

        // Replace dots with typewriter animation
        thinkingBubble.innerHTML = '';
        typewriterMessage(responseText, thinkingBubble);

      } catch(err) {
        thinkingBubble.innerHTML = '';
        typewriterMessage('Error: could not reach the server.', thinkingBubble);
      }

      setSendDisabled(false);
      textarea.focus();
    }

    function autoResize() {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
    }

    sendBtn.addEventListener('click', sendMessage);
    textarea.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    textarea.addEventListener('input', autoResize);
    window.addEventListener('load', () => { initSession(); textarea.focus(); });
  })();
  </script>
</body>
</html>
